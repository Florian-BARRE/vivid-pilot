<!doctype html>
<!--
  README banner of Vivid Pilot, in the style of Vivid Cards' banner. The
  pictures are pieces of the real panel on the demo home (render.mjs writes
  them to crops/). Rendered to docs/assets/banner.png by demo/render.mjs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vivid Pilot banner</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        position: relative;
        font-family: "Inter", system-ui, sans-serif;
        color: #f2f0f7;
        background:
          radial-gradient(
            520px 380px at 8% 6%,
            rgba(255, 140, 50, 0.18),
            transparent 70%
          ),
          radial-gradient(
            620px 460px at 92% 96%,
            rgba(138, 63, 252, 0.32),
            transparent 70%
          ),
          radial-gradient(
            520px 420px at 66% 18%,
            rgba(3, 169, 244, 0.16),
            transparent 70%
          ),
          radial-gradient(
            420px 320px at 40% 110%,
            rgba(255, 95, 109, 0.14),
            transparent 70%
          ),
          #0e0d13;
      }
      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.08;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.6) 0.6px,
          transparent 0.6px
        );
        background-size: 4px 4px;
      }
      .left {
        position: absolute;
        left: 64px;
        top: 70px;
        width: 540px;
      }
      .logo {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(255, 95, 109, 0.35);
      }
      h1 {
        margin: 34px 0 0;
        font-size: 84px;
        line-height: 0.95;
        letter-spacing: -3px;
        font-weight: 800;
      }
      h1 .vivid {
        background: linear-gradient(
          100deg,
          #ffb347 0%,
          #ff5f6d 45%,
          #b25cff 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 22px 0 0;
        font-size: 23px;
        line-height: 1.4;
        color: #b9b5c6;
      }
      p b {
        color: #f2f0f7;
        font-weight: 600;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 30px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 15px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 15px;
        font-weight: 600;
        color: #e5e2ee;
      }
      .chip i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .shot {
        position: absolute;
        border-radius: 18px;
        box-shadow:
          0 30px 70px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .cut {
        position: absolute;
        overflow: hidden;
        border-radius: 18px;
        box-shadow:
          0 30px 70px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .cut img {
        display: block;
        width: 100%;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <div
      class="glow"
      style="
        left: 780px;
        top: 40px;
        width: 360px;
        height: 220px;
        background: #03a9f4;
      "
    ></div>
    <div
      class="glow"
      style="
        left: 940px;
        top: 400px;
        width: 300px;
        height: 200px;
        background: #7b5cff;
      "
    ></div>
    <div
      class="cut"
      style="
        left: 640px;
        top: 96px;
        width: 240px;
        height: 470px;
        transform: rotate(-3deg);
      "
    >
      <img src="crops/tree.png" />
    </div>
    <img
      class="shot"
      src="crops/hero.png"
      style="left: 760px; top: 44px; width: 490px; transform: rotate(2deg)"
    />
    <img
      class="shot"
      src="crops/leds.png"
      style="left: 850px; top: 268px; width: 390px; transform: rotate(-1.5deg)"
    />
    <div
      class="cut"
      style="
        left: 720px;
        top: 500px;
        width: 470px;
        height: 120px;
        transform: rotate(1deg);
      "
    >
      <img src="crops/memory.png" />
    </div>
    <div class="left">
      <img class="logo" src="../assets/logo.svg" />
      <h1><span class="vivid">Vivid</span> Pilot</h1>
      <p>
        A Home Assistant integration that <b>sorts your home</b> and builds the
        groups, totals and lighting memories your cards need.
      </p>
      <div class="chips">
        <span class="chip"
          ><i style="background: #f5b042"></i>Rooms &amp; groups</span
        >
        <span class="chip"
          ><i style="background: #ff5f6d"></i>Power &amp; energy</span
        >
        <span class="chip"
          ><i style="background: #8a3ffc"></i>Lighting memory</span
        >
        <span class="chip"
          ><i style="background: #4fc3f7"></i>Climate &amp; sensors</span
        >
      </div>
    </div>
  </body>
</html>
