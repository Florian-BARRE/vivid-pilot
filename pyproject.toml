[project]
name = "vivid-pilot"
version = "0.3.1"
description = "Home Assistant integration: rooms, memories and automations for the Vivid family"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13.2"
dependencies = []

[dependency-groups]
dev = [
    "home-assistant-frontend==20260128.6",
    "pytest-homeassistant-custom-component>=0.13.316",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
